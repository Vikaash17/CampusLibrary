spring.application.name=CampusLibrary
server.port=8080

# Set DB_USERNAME and DB_PASSWORD in your shell or IntelliJ Run Configuration.
spring.datasource.url=jdbc:mysql://localhost:3306/gqldemo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Vikash@1
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate creates/updates entity tables. Use schema.sql to create and seed the DB first.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql
spring.graphql.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500
spring.graphql.cors.allowed-methods=GET,POST,OPTIONS
